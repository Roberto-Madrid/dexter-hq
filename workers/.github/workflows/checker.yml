name: checker
run-name: dexter-checker ${{ inputs.target_repo }} ${{ inputs.target_sha }} ${{ inputs.nonce }}
on:
  workflow_dispatch:
    inputs:
      target_repo: { required: true, type: string }
      target_sha: { required: true, type: string }
      nonce: { required: true, type: string }
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
          path: subject
      - name: Build
        working-directory: subject
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm ci || npm install
            npm run build --if-present
          else
            node build.js
          fi
      - name: Lint
        working-directory: subject
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm run lint --if-present
          else
            node lint.js
          fi
      - name: Test
        working-directory: subject
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            npm test
          else
            npx --yes @playwright/test@1.55.0 test
          fi
