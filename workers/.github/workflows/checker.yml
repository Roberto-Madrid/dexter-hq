name: checker
run-name: dexter-checker ${{ inputs.target_sha }}
on:
  workflow_dispatch:
    inputs:
      target_repo: { required: true, type: string }
      target_sha: { required: true, type: string }
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: judge
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.target_sha }}
          path: subject
      - name: Build
        working-directory: judge/checker-sample
        run: node build.js
      - name: Lint
        working-directory: judge/checker-sample
        run: node lint.js
      - name: Playwright screenshot
        working-directory: judge/checker-sample
        run: |
          npm init -y >/dev/null
          npm install --silent @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: checker-${{ inputs.target_sha }}
          path: judge/checker-sample/shots/*.png
          retention-days: 7
