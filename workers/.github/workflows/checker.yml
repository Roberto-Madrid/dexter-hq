name: checker
run-name: checker-${{ inputs.run_id }}
on:
  workflow_dispatch:
    inputs:
      run_id: { required: true, type: string }
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: checker-sample
        run: node build.js
      - name: Lint
        working-directory: checker-sample
        run: node lint.js
      - name: Playwright screenshot
        working-directory: checker-sample
        run: |
          npm init -y >/dev/null
          npm install --silent @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        with:
          name: checker-${{ inputs.run_id }}
          path: checker-sample/shots/*.png
          retention-days: 7
